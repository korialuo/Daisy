[package]
name = "daisy-app"
description = "Daisy 桌面应用：egui 界面与会话管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
daisy-core = { path = "../daisy-core" }
daisy-net = { path = "../daisy-net" }
daisy-rdp = { path = "../daisy-rdp" }
daisy-ssh = { path = "../daisy-ssh" }
daisy-store = { path = "../daisy-store" }
daisy-term = { path = "../daisy-term" }
# 原生文件选择对话框（SFTP 上传）
rfd = "0.15"
# 文件列表的修改时间（本地时区）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe.workspace = true
egui.workspace = true
# 直接量中文字体的 ascent/descent 与字形轮廓，算出「墨迹相对行框偏多少」。
# 版本与 epaint 内部用的对齐，避免同一进程里解析两套字体引擎。
ab_glyph = "0.2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# 口令/密钥在内存里用后即擦（store.rs、main.rs 的主机口令）
zeroize.workspace = true
arboard = "3.6.1"

# RDP 文件剪贴板（S10）：NSPasteboard 的文件 URL 读写。
# 只用 msg_send/sel/class 这几个运行时原语，不引入庞大的生成绑定
# （objc2-app-kit 的 feature 会拖进整套 AppKit 绑定）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
# macOS 延迟渲染剪贴板（NSFilePromiseProvider）：Finder 粘贴时才拉字节。
# 版本须与 objc2 0.6.5 对齐（app-kit 0.3 / foundation 0.3）。
objc2-app-kit = { version = "0.3", features = ["block2"] }
objc2-foundation = "0.3"
block2 = "0.6"

# Windows 文件剪贴板：CF_HDROP 读写（与 macOS 的 NSPasteboard 对应）。
# windows crate 提供 COM 抽象（IDataObject/IStream/IEnumFORMATETC）——
# mstsc 同款延迟渲染剪贴板需要实现这些接口，IStream::Read 时才拉字节。
# 版本与 rfd 间接引入的保持一致，复用同一份编译产物。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
# #[implement] 宏生成的代码用绝对路径 ::windows_core::，需要直接依赖。
windows-core = "0.62"

[dev-dependencies]
tempfile.workspace = true

# exe 资源（图标 + 版本信息）只在 Windows 宿主上真正编译，
# 见 build.rs。放在宿主条件表里，macOS 构建根本不会拉这个依赖。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
