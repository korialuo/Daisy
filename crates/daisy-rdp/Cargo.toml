[package]
name = "daisy-rdp"
description = "Daisy RDP 层：FreeRDP 库模式封装、帧渲染、输入注入、剪贴板"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
daisy-core = { path = "../daisy-core" }
thiserror.workspace = true
tracing.workspace = true

# FreeRDP 库不自己调 `WSAStartup`（只在它自己的示例客户端里调），
# Windows 上必须由使用者初始化 WinSock，否则 `getaddrinfo` 直接失败。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
bindgen = "0.73"
